# Environment: serverless environment 4 (Python 3.12.3; numpy 2.1.3, pandas 2.2.3, scipy 1.15.1, scikit-learn 1.6.1,
# pyarrow 19.0.1, mlflow-skinny 2.22.0, per the Databricks release notes, checked 22 Oct 2026). Only lightgbm is added;
# scikit-learn and mlflow-skinny come from the base, so nothing in it is upgraded.
resources:
  experiments:
    # One MLflow experiment for every back-test run (docs/design/backtest.md §7). Keys are unique across resource types.
    backtest_experiment:
      name: /Workspace/Users/${workspace.current_user.userName}/coolcheck-backtest

  jobs:
    # Rolling back-test: 14 monthly folds Jul 2025 to Aug 2026, three baselines, ablations, MLflow runs and a report.
    backtest:
      name: coolcheck backtest
      max_concurrent_runs: 1
      timeout_seconds: 3600
      parameters:
        - name: cutoff_minutes
          default: "15"
        - name: bootstrap
          default: "2000"
        - name: folds
          default: "14"
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies:
              - lightgbm==4.6.0
      tasks:
        - task_key: backtest
          max_retries: 0
          environment_key: ml
          spark_python_task:
            python_file: ../src/jobs/backtest.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --src
              - ${workspace.file_path}/src
              - --experiment-id
              - ${resources.experiments.backtest_experiment.id}
              - --git-sha
              - ${bundle.git.commit}
              - --cutoff-minutes
              - "{{job.parameters.cutoff_minutes}}"
              - --bootstrap
              - "{{job.parameters.bootstrap}}"
              - --folds
              - "{{job.parameters.folds}}"
