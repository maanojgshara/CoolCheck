# The live model's refit (Guide §A11 decision 8(e); src/jobs/live_model.py): the final check's configuration refit once
# on all completed target dates from 2025-01-17 to 2026-10-22, logged to the back-test experiment (role = live_model)
# and registered in Unity Catalog as <catalog>.ml.heat_model with the alias champion. Run by hand, once; no schedule.
# It refuses when the model already has a version.
#   databricks bundle run live_model -t dev -p coolcheck
# Written as live_model.job.yml.draft; renamed to live_model.job.yml for its first deploy.
#
# Recovery when the run registered a version but setting the alias (or a tag) then failed (review finding 3,
# docs/checks/review_live_model_nightly.md). Symptoms: this job refuses to run again ("already has version(s)…") and the
# nightly heat_forecast fails on the missing alias. Do not refit and do not delete the version. Set the alias by hand on
# the version this run registered (its number is in the run's log and on the model's page), read it back, then rerun the
# nightly job for each date it missed:
#   databricks registered-models set-alias <catalog>.ml.heat_model champion <version> -p <profile>
#   databricks registered-models get <catalog>.ml.heat_model --include-aliases -p <profile>
#   databricks bundle run heat_forecast -t <target> -p <profile> --params target_date=<YYYY-MM-DD>
# The version tags the run did not set (model_sha256, training_window, train_rows, ...) are also among its MLflow run's
# parameters. The nightly job reads only training_window, and without it treats the model as trained to 2026-10-22, the
# refit's last day; its log then shows "model sha256 ?".
resources:
  jobs:
    live_model:
      name: coolcheck live model refit
      max_concurrent_runs: 1
      timeout_seconds: 3600
      environments:
        - environment_key: ml
          spec:
            environment_version: "4"
            dependencies:
              - lightgbm==4.6.0
      tasks:
        - task_key: refit
          max_retries: 0
          environment_key: ml
          spark_python_task:
            python_file: ../src/jobs/live_model.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --src
              - ${workspace.file_path}/src
              - --experiment-id
              - ${resources.experiments.backtest_experiment.id}
              - --git-sha
              - ${bundle.git.commit}
              - --model-name
              - ${var.catalog}.ml.heat_model
